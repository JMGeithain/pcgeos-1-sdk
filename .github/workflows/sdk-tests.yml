name: SDK source tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q pcgeos1 tests
      - name: Test target profile validation
        run: python tests/test_target_profiles.py
      - name: Test GEODE paragraph alignment
        run: python tests/test_geode_alignment.py
